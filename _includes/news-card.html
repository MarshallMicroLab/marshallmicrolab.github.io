{% assign post = include.post %}
<article class="news-card"><p class="card-kicker"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%B %-d, %Y' }}</time></p><h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3><p>{{ post.summary | default: post.content | markdownify | strip_html | truncatewords: 26 }}</p><a class="text-link" href="{{ post.url | relative_url }}">Read update <span aria-hidden="true">→</span></a></article>
