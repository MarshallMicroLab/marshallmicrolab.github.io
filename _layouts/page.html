---
layout: default
---
{% if page.hero %}
  {{ content }}
{% else %}
  <header class="page-header">
    <div class="container measure">
      <p class="eyebrow">{{ page.eyebrow | default: site.short_title }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
    </div>
  </header>
  <div class="container page-content">{{ content }}</div>
{% endif %}
