---
layout: default
---
<article class="container detail-page">
  <a class="back-link" href="{{ '/news/' | relative_url }}">← All news</a>
  <header class="post-header">
    <p class="eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
  </header>
  {% if page.image %}<figure class="post-image"><img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}"></figure>{% endif %}
  <div class="prose measure">{{ content }}</div>
</article>
