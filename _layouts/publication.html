---
layout: default
---
<article class="container detail-page">
  <a class="back-link" href="{{ '/publications/' | relative_url }}">← All publications</a>
  <header class="post-header">
    <p class="eyebrow">Publication · {{ page.year }}</p>
    <h1>{{ page.title }}</h1>
    <p class="lead">{{ page.authors }}</p>
    <p><em>{{ page.journal }}</em></p>
    {% include publication-links.html publication=page %}
  </header>
  {% if page.image %}<figure class="post-image"><img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}"></figure>{% endif %}
  {% if content != empty %}<div class="prose measure">{{ content }}</div>{% endif %}
</article>
